<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoneware & Linen</title>
<style>
:root{--bg:#f1f3ef;--ink:#17212b;--mute:#5d6b76;--acc:#0f766e;--line:#cfd6d0}
@media(prefers-color-scheme:dark){:root{--bg:#10181c;--ink:#e8eeea;--mute:#93a3a0;--acc:#4fd1b8;--line:#25343a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,.price{font-family:Georgia,'Iowan Old Style',serif;font-weight:600}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
header h1{margin:0 auto 0 0;font-size:1.4rem}
main{max-width:980px;margin:0 auto;padding:1.5rem 1.25rem}
button{font:inherit;padding:.4rem .9rem;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem}
.tile{border:1px solid var(--line);border-radius:3px;padding:1rem;display:flex;flex-direction:column;gap:.35rem}
.tile h3{margin:0}.price{font-size:1.7rem}
.box{border:1px solid var(--line);border-radius:3px;padding:1rem;margin-bottom:1rem;max-width:420px}
input,textarea,select{font:inherit;width:100%;padding:.45rem;margin:.25rem 0 .75rem;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
select{width:auto;margin:0}
.mute{color:var(--mute);font-size:.9rem;margin:0}
table{width:100%;border-collapse:collapse;margin-bottom:1.5rem}
td,th{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header><h1>Stoneware & Linen</h1><nav id="nav" style="display:flex;gap:.5rem;flex-wrap:wrap"></nav></header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
let token = load('token', null), user = load('user', null), cart = load('cart', {}), products = [], current = 'shop';

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) },
    body: body && JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}
const persist = () => { localStorage.setItem('cart', JSON.stringify(cart)); localStorage.setItem('token', JSON.stringify(token)); localStorage.setItem('user', JSON.stringify(user)); };

function nav() {
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  $('#nav').innerHTML =
    `<button onclick="show('shop')">Shop</button><button onclick="show('cart')">Cart (${n})</button>` +
    (user ? `<button onclick="show('orders')">My orders</button>` +
      (user.role === 'admin' ? `<button onclick="show('admin')">Admin</button>` : '') +
      `<button onclick="logout()">Log out ${esc(user.name)}</button>`
      : `<button class="p" onclick="show('login')">Log in</button>`);
}

const views = {
  async shop() {
    products = await api('/products');
    return `<div class="grid">${products.map(p => `<div class="tile"><h3>${esc(p.name)}</h3>
      <p class="mute">${esc(p.description)}</p><span class="price">${money(p.price)}</span>
      <p class="mute">${p.stock ? p.stock + ' in stock' : 'Sold out'}</p>
      <button class="p" ${p.stock ? '' : 'disabled'} onclick="add('${p._id}')">Add to cart</button></div>`).join('')}</div>`;
  },
  async cart() {
    products = await api('/products');
    const rows = Object.entries(cart).map(([id, q]) => ({ p: products.find(x => x._id === id), q })).filter(r => r.p);
    if (!rows.length) return '<p>Your cart is empty. Pick something from the shop.</p>';
    const total = rows.reduce((s, r) => s + r.p.price * r.q, 0);
    return `<table>${rows.map(({ p, q }) => `<tr><td>${esc(p.name)}</td><td>${money(p.price)} x ${q}</td>
      <td><button onclick="add('${p._id}',-1)">-</button> <button onclick="add('${p._id}',1)">+</button></td></tr>`).join('')}</table>
      <h2>Total ${money(total)}</h2><div class="box"><label>Shipping address<textarea id="addr" rows="3"></textarea></label>
      <button class="p" onclick="checkout()">Place order</button></div>`;
  },
  async login() {
    return `<div class="box"><h2>Log in or sign up</h2><label>Name (sign-up only)<input id="n"></label>
      <label>Email<input id="e" type="email"></label><label>Password<input id="pw" type="password"></label>
      <button class="p" onclick="authenticate('login')">Log in</button> <button onclick="authenticate('register')">Sign up</button>
      <p class="mute" style="margin-top:1rem">Demo admin: admin@store.com / admin123</p></div>`;
  },
  async orders() {
    if (!user) return views.login();
    const os = await api('/orders/mine');
    if (!os.length) return '<p>No orders yet.</p>';
    return os.map(o => `<div class="box" style="max-width:none"><b>Order ${o._id.slice(-6)}</b> is ${o.status}, total ${money(o.total)}
      <p class="mute">${o.items.map(i => esc(i.name) + ' x' + i.qty).join(', ')}</p></div>`).join('');
  },
  async admin() {
    const [ps, os] = await Promise.all([api('/products'), api('/orders')]);
    return `<h2>Add a product</h2><div class="box"><input id="pn" placeholder="Name"><input id="pd" placeholder="Description">
      <input id="pp" type="number" step="0.01" placeholder="Price"><input id="ps" type="number" placeholder="Stock">
      <button class="p" onclick="addProduct()">Add product</button></div>
      <h2>Products</h2><table>${ps.map(p => `<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock} left</td>
      <td><button onclick="delProduct('${p._id}')">Delete</button></td></tr>`).join('')}</table>
      <h2>Orders</h2><table>${os.map(o => `<tr><td>${o._id.slice(-6)}</td><td>${esc(o.user && o.user.email)}</td><td>${money(o.total)}</td>
      <td><select onchange="setStatus('${o._id}',this.value)">${['pending', 'paid', 'shipped', 'delivered', 'cancelled']
        .map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>`;
  },
};

async function show(v) {
  current = v; nav();
  try { $('#app').innerHTML = await views[v](); }
  catch (e) { $('#app').innerHTML = `<p>${esc(e.message)}</p>`; }
}
function add(id, d = 1) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  persist(); current === 'cart' ? show('cart') : nav();
}
async function authenticate(kind) {
  try {
    const d = await api('/auth/' + kind, 'POST', { name: $('#n').value, email: $('#e').value, password: $('#pw').value });
    token = d.token; user = d.user; persist(); show('shop');
  } catch (e) { alert(e.message); }
}
function logout() { token = user = null; persist(); show('shop'); }
async function checkout() {
  if (!user) return show('login');
  try {
    await api('/orders', 'POST', { address: $('#addr').value, items: Object.entries(cart).map(([productId, qty]) => ({ productId, qty })) });
    cart = {}; persist(); show('orders');
  } catch (e) { alert(e.message); }
}
async function addProduct() {
  try { await api('/products', 'POST', { name: $('#pn').value, description: $('#pd').value, price: +$('#pp').value, stock: +$('#ps').value }); show('admin'); }
  catch (e) { alert(e.message); }
}
async function delProduct(id) { await api('/products/' + id, 'DELETE'); show('admin'); }
async function setStatus(id, status) { try { await api(`/orders/${id}/status`, 'PATCH', { status }); } catch (e) { alert(e.message); } }
show('shop');
</script>
</body>
</html>
